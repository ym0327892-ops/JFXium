name: JFXium CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]          # 推 v* tag → 跑 CI + 发 Release
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 21 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build & Test (with virtual display)
        run: xvfb-run --auto-servernum ./mvnw install -pl jfxium -am -B -ntp

      - name: Build Demo (verify downstream)
        run: xvfb-run --auto-servernum ./mvnw verify -pl jfxium-demo -B -ntp -DskipTests

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java${{ matrix.java }}
          path: |
            jfxium/target/surefire-reports/
            jfxium-demo/target/surefire-reports/
          retention-days: 7

  red-line-scan:
    name: Red Line Compliance Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Scan red line #1 — setStyle with color/px"
        run: |
          # Strip comments first: javadoc prose such as "SKILL #1" would otherwise
          # satisfy the hex pattern and fail the whole job on a docs-only change.
          violations=$(find jfxium/src/main/java -name '*.java' -print0 \
            | xargs -0 perl -0777 -pe 's{/\*.*?\*/}{}gs; s{//[^\n]*}{}g' \
            | grep -cE 'setStyle[^;]*(#[0-9a-fA-F]{3,8}\b|[0-9]+(\.[0-9]+)?px)' || true)
          echo "Red Line #1 (setStyle magic values): $violations"
          [ "$violations" -eq 0 ] || { echo "❌ FAILED"; exit 1; }

      - name: "Scan red line #11 — demo new native controls"
        run: |
          # Require a constructor call `new Label(`: array creation `new Label[]{...}`
          # is not a control instance, and the optional (Ant|Type) capture lets the
          # inverse filter drop ButtonAnt / ButtonType wrappers.
          pattern='new (Label|Button|TextField|HBox|VBox|ComboBox|RadioButton|CheckBox|TextArea|Slider|ProgressBar|TableView|TreeView|StackPane)(Ant|Type)?\('
          inverse='new (Label|Button|TextField|HBox|VBox|ComboBox|RadioButton|CheckBox|TextArea|Slider|ProgressBar|TableView|TreeView|StackPane)(Ant|Type)\('
          violations=$(grep -rnE "$pattern" jfxium-demo/src/main/java --include="*.java" \
            | grep -vE "$inverse" | wc -l)
          echo "Red Line #11 (demo new native controls): $violations"
          echo "Open items:"
          grep -rnE "$pattern" jfxium-demo/src/main/java --include="*.java" \
            | grep -vE "$inverse" || true
          [ "$violations" -eq 0 ] || { echo "❌ FAILED"; exit 1; }

      - name: Scan red line #2 — CSS box-shadow
        run: |
          violations=$(grep -rn 'box-shadow' jfxium/src/main/resources --include="*.less" | wc -l)
          echo "Red Line #2 (CSS box-shadow): $violations"
          [ "$violations" -eq 0 ] || { echo "❌ FAILED"; exit 1; }

      - name: "Scan red line #3 — CSS :active/:focus"
        run: |
          # Strip comments, then flag only bare :active / :focus.
          # :focused / :focus-visible / :focus-within are JavaFX-native states and are
          # the sanctioned replacements (see components/_focus.less); the dead-code trap
          # is the custom `.focus-visible` class, which is checked explicitly.
          violations=$(find jfxium/src/main/resources -name '*.less' -print0 \
            | xargs -0 perl -0777 -pe 's{/\*.*?\*/}{}gs; s{//[^\n]*}{}g' \
            | grep -cE ':active([^-a-zA-Z]|$)|:focus([^-a-zA-Z]|$)|\.focus-visible' || true)
          echo "Red Line #3 (CSS :active/:focus): $violations"
          [ "$violations" -eq 0 ] || { echo "❌ FAILED"; exit 1; }

      - name: "Scan red line #8 — styleClass without jfx- prefix"
        run: |
          # Only literal additions; concatenated names ("a" + x) resolve at runtime.
          line='getStyleClass\(\)\.add\("'
          violations=$(grep -rnE "$line" jfxium/src/main/java --include="*.java" \
            | grep -vE 'add\("jfx-' | wc -l)
          echo "Red Line #8 (no jfx- prefix): $violations"
          grep -rnE "$line" jfxium/src/main/java --include="*.java" \
            | grep -vE 'add\("jfx-' || true
          [ "$violations" -eq 0 ] || { echo "❌ FAILED"; exit 1; }

      - name: "Scan docs — theme must be loaded via ThemeManager (module-path safe)"
        run: |
          # JFXium is a named module. A consumer's getResource() CANNOT read CSS that
          # lives inside org.openkawu.jfxium, so teaching
          #   scene.getStylesheets().add(getClass().getResource("/org/openkawu/jfxium/css/..."))
          # produces a runtime NPE on module-path (verified). The only sanctioned entry
          # point is ThemeManager.applyTheme(new XxxTheme()), which locates the CSS on
          # the framework side.
          # Lines that explicitly forbid it (⚠️ 别用/不要用) and the ~/.m2 install
          # examples are allowed; the pattern below only matches positive examples.
          hits=$(grep -rnE 'getStylesheets\(\)\.add\(.*getResource\(.*org/openkawu/jfxium/css' \
            README.md README_CN.md docs/ INTERNAL/ 2>/dev/null \
            | grep -vE '别用|不要用|⚠️' || true)
          echo "Docs theme-loading pattern:"
          [ -z "$hits" ] && echo "  0 hits - OK" || echo "$hits"
          [ -z "$hits" ] || { echo "❌ FAILED: docs teach the module-path-unsafe theme pattern"; exit 1; }

      - name: "Scan deps — javafx-controls must stay compile+optional"
        run: |
          # javafx-controls 的名字出现在 module-info.java 的 requires 里，
          # 所以它在主源码编译期必须可见（非 test / runtime scope）；
          # 同时它要「不向下游传递」（optional），由应用自选版本。
          # 本地 Liberica-FX JDK 自带宽 jmod，会掩盖 scope 错误 —— 只有 CI 能拦。
          # 参考 BUG #161。
          block=$(awk '/<artifactId>javafx-controls<\/artifactId>/{f=1} f{print} /<\/dependency>/{if(f)exit}' jfxium/pom.xml)
          echo "$block"
          echo "$block" | grep -q "<optional>true</optional>" \
            || { echo "❌ javafx-controls 必须是 <optional>true</optional>（不向下游传递）"; exit 1; }
          echo "$block" | grep -qE "<scope>(test|runtime|provided)</scope>" \
            && { echo "❌ javafx-controls 不能是 test/runtime/provided scope（需要主源码编译期可见）"; exit 1; }
          echo "OK: javafx-controls = compile + optional"

      - name: Scan architecture — core→component reverse deps
        run: |
          violations=$(grep -rn 'import.*component\.' jfxium/src/main/java/org/openkawu/jfxium/core/ --include="*.java" | wc -l)
          echo "Architecture (core→component reverse deps): $violations"
          [ "$violations" -eq 0 ] || { echo "❌ FAILED"; exit 1; }

      - name: Scan i18n — key count
        run: |
          count_keys() { grep -cE '^[[:space:]]*[^#![:space:]][^=]*=' "$1" || true; }
          zh=$(count_keys jfxium/src/main/resources/org/openkawu/jfxium/i18n/messages_zh_CN.properties)
          en=$(count_keys jfxium/src/main/resources/org/openkawu/jfxium/i18n/messages_en.properties)
          echo "i18n keys: zh_CN=$zh, en=$en"
          [ "$zh" -eq "$en" ] || { echo "❌ FAILED: key count mismatch"; exit 1; }

      - name: "Scan deps — phantom module requirements (BUG #154)"
        run: |
          # Every `requires X;` in module-info must be backed by real source usage.
          # javafx.fxml was once declared with zero imports, breaking module-path consumers.
          fail=0
          for m in javafx.controls java.logging; do
            grep -q "requires $m;" jfxium/src/main/java/org/openkawu/jfxium/module-info.java || continue
            case "$m" in
              javafx.controls) pat='javafx\.scene\.control' ;;
              java.logging)    pat='java\.util\.logging' ;;
            esac
            if ! grep -rqE "$pat" jfxium/src/main/java --include='*.java' --exclude=module-info.java; then
              echo "❌ FAILED: requires $m but no source usage"; fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: "Scan deps — phantom third-party compile deps (BUG #155)"
        run: |
          # Every non-test dependency in jfxium/pom.xml must be backed by an import in main
          # sources. ikonli was declared compile-scope with zero imports (2 jars forced on
          # consumers). NOTE: artifact groupId != java package, so the map is explicit;
          # extend it when adding a dependency — that forces a real usage check.
          deps=$(awk '/<build>/{exit} 1' jfxium/pom.xml | perl -0777 -ne '
            while (/<dependency>(.*?)<\/dependency>/gs) {
              my $b = $1;
              next if $b =~ /<scope>test<\/scope>/;
              print "$1\n" if $b =~ /<groupId>\s*([^<\s]+)\s*<\/groupId>/;
            }' | sort -u)
          fail=0
          for g in $deps; do
            case "$g" in
              org.openjfx)        pat='javafx\.' ;;
              org.kordamp.ikonli) pat='org\.kordamp' ;;
              *)                  pat=$(echo "$g" | sed 's|\.|\\.|g') ;;
            esac
            if ! grep -rqE "import $pat" jfxium/src/main/java --include='*.java'; then
              echo "❌ FAILED: compile dep '$g' has no matching import in main sources"; fail=1
            fi
          done
          echo "compile deps checked: $(echo $deps | tr '\n' ' ')"
          [ "$fail" -eq 0 ] || exit 1

      - name: "Scan deps — consumer-install command must include -am (BUG #156)"
        run: |
          # The jfxium module's <parent> is jfxium-parent. Installing with `-pl jfxium`
          # alone leaves the parent uninstalled, so downstream resolution of
          # org.openkawu:jfxium fails with "Could not find artifact ...jfxium-parent:pom".
          # Every documented one-shot install command must therefore carry -am.
          hits=$(grep -rnE 'install -pl jfxium' README.md README_CN.md INTERNAL/QUICKSTART.md \
            docs/cn/快速上手.md AGENTS.md .qoder/skills/workflow.md 2>/dev/null \
            | grep -v -- '-am' || true)
          echo "$hits"
          [ -z "$hits" ] || { echo "❌ FAILED: 'install -pl jfxium' without -am"; exit 1; }

  summary:
    name: CI Summary
    if: always()
    # release 只在推 tag 时跑（分支推送时为 skipped），故不算「失败」
    needs: [ build-and-test, red-line-scan, release ]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          REL="${{ needs.release.result }}"
          if [ "${{ needs.build-and-test.result }}" = "success" ] \
             && [ "${{ needs.red-line-scan.result }}" = "success" ] \
             && { [ "$REL" = "success" ] || [ "$REL" = "skipped" ]; }; then
            echo "✅ All checks passed (release: $REL)"
          else
            echo "❌ Some checks failed — review details above (release: $REL)"
            exit 1
          fi

  # ------------------------------------------------------------------
  # Release：只在推 v* tag 时触发，产出 jar / sources / javadoc 并挂到
  # GitHub Releases（Actions 页的 artifact 只有 7 天期限，Release 附件永久）。
  #
  # 发版流程：先改 pom 版本号（parent + jfxium + jfxium-demo 三处），
  # 提交后打 tag 推送即可：
  #   git tag v1.34.1 && git push origin v1.34.1
  # 若 tag 名与 pom 版本不一致，下面的「版本校验」步骤会直接失败。
  # ------------------------------------------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-and-test, red-line-scan ]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 创建 Release 需要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      # 版本校验：tag 与 pom 版本必须一致，否则包名会撒谎
      - name: Verify tag matches pom version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          POM=$(./mvnw -q -B -ntp -DforceStdout help:evaluate -Dexpression=project.version -pl jfxium | tail -1)
          echo "tag=$TAG pom=$POM"
          [ "$TAG" = "$POM" ] || { echo "❌ tag $TAG != pom $POM（先同步三处 pom 的 <version>）"; exit 1; }

      # 复用 CI 已验证过的测试结果，这里只打包，避免重复跑 1492 个用例
      - name: Package jar / sources / javadoc
        run: |
          xvfb-run --auto-servernum ./mvnw -B -ntp -pl jfxium -am -DskipTests install
          xvfb-run --auto-servernum ./mvnw -B -ntp -pl jfxium \
            org.apache.maven.plugins:maven-source-plugin:3.3.1:jar \
            org.apache.maven.plugins:maven-javadoc-plugin:3.6.3:jar

      # jar 是下游唯一交付物：缺 module-info / CSS / i18n 都属交付事故，这里硬卡
      - name: Smoke-check jar contents
        run: |
          # 做成「计数」而非 `unzip | grep -q`：后者在 pipefail 下会因 head/grep
          # 提前关闭管道吃到 SIGPIPE（141），把正确的产物判成失败。整个 jar 只列一次。
          check() { # $1=jar $2=必需条目 $3=判据说明
            local listing
            listing=$(unzip -l "$1")
            case "$listing" in
              *"$2"*) echo "  [OK] $1 含 $3" ;;
              *)      echo "  [FAIL] $1 缺 $3"; return 1 ;;
            esac
          }
          rc=0
          JAR=$(ls jfxium/target/jfxium-*.jar | grep -v -- '-sources\|-javadoc' | head -1)
          echo "checking $JAR"
          for entry in module-info.class css/theme-light.css css/theme-dark.css \
                       i18n/messages_zh_CN.properties i18n/messages_en.properties; do
            check "$JAR" "$entry" "$entry" || rc=1
          done
          # sources / javadoc 也必须真有内容：maven-javadoc-plugin 缺 <sourcepath>
          # 时会「BUILD SUCCESS 但产出空 jar」（只有 src/ 目录、527 字节，实测），
          # 这种假产物绝不能挂上 Release。
          SRC=$(ls jfxium/target/jfxium-*-sources.jar)
          JDOC=$(ls jfxium/target/jfxium-*-javadoc.jar)
          check "$SRC" ".java"      "源码 .java"     || rc=1
          check "$JDOC" "index.html" "javadoc 入口页" || rc=1
          [ "$rc" -eq 0 ] || { echo "❌ 交付物校验失败"; exit 1; }
          unzip -l "$JAR" | tail -2; unzip -l "$SRC" | tail -2; unzip -l "$JDOC" | tail -2

      # 附件：主 jar + sources + javadoc + 两个 pom。
      # 两个 pom 是必需的：jfxium.jar 内的 pom 带 <parent>jfxium-parent</parent>，
      # 若只用 `install-file -Dfile=...jar`（不给 -DpomFile），Maven 会从 jar 里
      # 读出这段 parent 引用，而本地/远程都没有 parent → 下游解析
      # `org.openkawu:jfxium` 直接失败（报 Could not find artifact
      # org.openkawu:jfxium-parent:pom）。附上 pom 才能走
      # `install-file -DpomFile=` 一次装好（已实测）。
      - name: Stage release assets
        run: |
          mkdir -p release
          cp jfxium/target/jfxium-*.jar release/
          cp pom.xml       "release/jfxium-parent-${GITHUB_REF_NAME#v}.pom"
          cp jfxium/pom.xml "release/jfxium-${GITHUB_REF_NAME#v}.pom"
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: JFXium ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
