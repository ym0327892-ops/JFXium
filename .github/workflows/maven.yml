name: JFXium CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 21 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build & Test (with virtual display)
        run: xvfb-run --auto-servernum ./mvnw verify -pl jfxium -B -ntp

      - name: Build Demo (verify downstream)
        run: xvfb-run --auto-servernum ./mvnw verify -pl jfxium-demo -B -ntp -DskipTests

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java${{ matrix.java }}
          path: |
            jfxium/target/surefire-reports/
            jfxium-demo/target/surefire-reports/
          retention-days: 7

  red-line-scan:
    name: Red Line Compliance Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Scan red line #1 — setStyle with color/px"
        run: |
          # Strip comments first: javadoc prose such as "SKILL #1" would otherwise
          # satisfy the hex pattern and fail the whole job on a docs-only change.
          violations=$(find jfxium/src/main/java -name '*.java' -print0 \
            | xargs -0 perl -0777 -pe 's{/\*.*?\*/}{}gs; s{//[^\n]*}{}g' \
            | grep -cE 'setStyle[^;]*(#[0-9a-fA-F]{3,8}\b|[0-9]+(\.[0-9]+)?px)' || true)
          echo "Red Line #1 (setStyle magic values): $violations"
          [ "$violations" -eq 0 ] || { echo "❌ FAILED"; exit 1; }

      - name: "Scan red line #11 — demo new native controls"
        run: |
          # Require a constructor call `new Label(`: array creation `new Label[]{...}`
          # is not a control instance, and the optional (Ant|Type) capture lets the
          # inverse filter drop ButtonAnt / ButtonType wrappers.
          pattern='new (Label|Button|TextField|HBox|VBox|ComboBox|RadioButton|CheckBox|TextArea|Slider|ProgressBar|TableView|TreeView|StackPane)(Ant|Type)?\('
          inverse='new (Label|Button|TextField|HBox|VBox|ComboBox|RadioButton|CheckBox|TextArea|Slider|ProgressBar|TableView|TreeView|StackPane)(Ant|Type)\('
          violations=$(grep -rnE "$pattern" jfxium-demo/src/main/java --include="*.java" \
            | grep -vE "$inverse" | wc -l)
          echo "Red Line #11 (demo new native controls): $violations"
          echo "Open items:"
          grep -rnE "$pattern" jfxium-demo/src/main/java --include="*.java" \
            | grep -vE "$inverse" || true
          [ "$violations" -eq 0 ] || { echo "❌ FAILED"; exit 1; }

      - name: Scan red line #2 — CSS box-shadow
        run: |
          violations=$(grep -rn 'box-shadow' jfxium/src/main/resources --include="*.less" | wc -l)
          echo "Red Line #2 (CSS box-shadow): $violations"
          [ "$violations" -eq 0 ] || { echo "❌ FAILED"; exit 1; }

      - name: "Scan red line #3 — CSS :active/:focus"
        run: |
          # Strip comments, then flag only bare :active / :focus.
          # :focused / :focus-visible / :focus-within are JavaFX-native states and are
          # the sanctioned replacements (see components/_focus.less); the dead-code trap
          # is the custom `.focus-visible` class, which is checked explicitly.
          violations=$(find jfxium/src/main/resources -name '*.less' -print0 \
            | xargs -0 perl -0777 -pe 's{/\*.*?\*/}{}gs; s{//[^\n]*}{}g' \
            | grep -cE ':active([^-a-zA-Z]|$)|:focus([^-a-zA-Z]|$)|\.focus-visible' || true)
          echo "Red Line #3 (CSS :active/:focus): $violations"
          [ "$violations" -eq 0 ] || { echo "❌ FAILED"; exit 1; }

      - name: "Scan red line #8 — styleClass without jfx- prefix"
        run: |
          # Only literal additions; concatenated names ("a" + x) resolve at runtime.
          line='getStyleClass\(\)\.add\("'
          violations=$(grep -rnE "$line" jfxium/src/main/java --include="*.java" \
            | grep -vE 'add\("jfx-' | wc -l)
          echo "Red Line #8 (no jfx- prefix): $violations"
          grep -rnE "$line" jfxium/src/main/java --include="*.java" \
            | grep -vE 'add\("jfx-' || true
          [ "$violations" -eq 0 ] || { echo "❌ FAILED"; exit 1; }

      - name: Scan architecture — core→component reverse deps
        run: |
          violations=$(grep -rn 'import.*component\.' jfxium/src/main/java/org/openkawu/jfxium/core/ --include="*.java" | wc -l)
          echo "Architecture (core→component reverse deps): $violations"
          [ "$violations" -eq 0 ] || { echo "❌ FAILED"; exit 1; }

      - name: Scan i18n — key count
        run: |
          count_keys() { grep -cE '^[[:space:]]*[^#![:space:]][^=]*=' "$1" || true; }
          zh=$(count_keys jfxium/src/main/resources/org/openkawu/jfxium/i18n/messages_zh_CN.properties)
          en=$(count_keys jfxium/src/main/resources/org/openkawu/jfxium/i18n/messages_en.properties)
          echo "i18n keys: zh_CN=$zh, en=$en"
          [ "$zh" -eq "$en" ] || { echo "❌ FAILED: key count mismatch"; exit 1; }

  summary:
    name: CI Summary
    if: always()
    needs: [ build-and-test, red-line-scan ]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.build-and-test.result }}" = "success" ] && [ "${{ needs.red-line-scan.result }}" = "success" ]; then
            echo "✅ All checks passed"
          else
            echo "❌ Some checks failed — review details above"
            exit 1
          fi
